<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PLACEHOLDER: names -->
  <title data-i18n="booth.title">Tùng &amp; Giang · Lưu ngày cưới</title>
  <meta name="description" content="Chúng mình sắp cưới — hãy lưu lại ngày này nhé." data-i18n-attr="content:booth.desc">
  <meta name="theme-color" content="#4b0505">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%234b0505%27 stroke=%27%23c9a25c%27 stroke-width=%273%27/%3E%3Cpath d=%27M32 46s-14-8-14-17a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 9-14 17-14 17z%27 fill=%27%23f6ecd9%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    document.documentElement.classList.add("js");
    // Saved non-default language: hide the page until i18n.js has translated it.
    try {
      if (localStorage.getItem("lang") === "en") {
        document.documentElement.classList.add("i18n-wait");
        setTimeout(() => document.documentElement.classList.remove("i18n-wait"), 2000);
      }
    } catch (e) {}
    // Arriving through a view transition: skip entrance fades on shared
    // elements so the morph lands on visible content.
    addEventListener("pagereveal", (e) => {
      if (e.viewTransition) document.documentElement.classList.add("vt-arrive");
    });
    // No cross-document view transitions (e.g. Firefox): use the fade fallback.
    if (!("onpagereveal" in window)) document.documentElement.classList.add("vt-fallback");
    // Personal link (?g=<token>): carry the token to the invitation and fetch
    // the guest's name now, so the invitation can greet them without waiting.
    const token = new URLSearchParams(location.search).get("g");
    const guestApi = token && /^[A-Za-z0-9_-]{22}$/.test(token) ? "/api/guest?g=" + token : "";
    const invitation = "invitation" + (guestApi ? "?g=" + token : "");
    if (guestApi) {
      fetch(guestApi)
        .then((res) => (res.ok ? res.json() : null))
        .then((guest) => {
          if (guest && guest.name) localStorage.setItem("guest", JSON.stringify({ token, name: guest.name }));
        })
        .catch(() => {});
    }
    // Chrome/Edge: render the invitation in the background so it opens instantly.
    // No speculation rules (Firefox, Safari): prefetch the invitation and its
    // assets into the cache so opening it doesn't wait on the network.
    if (HTMLScriptElement.supports && HTMLScriptElement.supports("speculationrules")) {
      const rules = document.createElement("script");
      rules.type = "speculationrules";
      rules.textContent = JSON.stringify({ prerender: [{ urls: [invitation], eagerness: "immediate" }] });
      document.head.append(rules);
    } else {
      [
        invitation,
        "assets/js/i18n.js",
        "assets/js/invitation.js",
        "assets/img/photo-1.svg",
        "assets/img/photo-2.svg",
        "assets/fonts/cormorant-garamond-normal-400-latin.woff2",
        "assets/fonts/cormorant-garamond-normal-500-latin.woff2",
        "assets/fonts/cormorant-garamond-italic-400-latin.woff2",
        "assets/fonts/manrope-normal-400-latin.woff2",
        "assets/fonts/manrope-normal-600-latin.woff2",
        "assets/fonts/cormorant-garamond-normal-400-vietnamese.woff2",
        "assets/fonts/cormorant-garamond-normal-500-vietnamese.woff2",
        "assets/fonts/manrope-normal-400-vietnamese.woff2",
        "assets/fonts/manrope-normal-600-vietnamese.woff2",
        "assets/fonts/pinyon-script-normal-400-vietnamese.woff2",
      ].forEach((href) => {
        const link = document.createElement("link");
        link.rel = "prefetch";
        link.href = href;
        document.head.append(link);
      });
    }
  </script>
</head>
<body>
  <button class="lang lang--corner" type="button" data-lang-toggle data-i18n="lang.toggle" data-i18n-attr="aria-label:lang.label" aria-label="Switch to English">EN</button>
  <main class="booth">
    <header class="booth__intro">
      <p class="eyebrow" data-i18n="booth.eyebrow">Chúng mình sắp cưới!</p>
      <!-- PLACEHOLDER: names -->
      <h1 class="script">Tùng &amp; Giang</h1>
    </header>

    <div class="shadowbox">
      <img class="shadowbox__frame" src="assets/img/frame.png" alt="" width="408" height="799">
      <div class="shadowbox__recess">
        <figure class="strip" aria-label="Dải ảnh photobooth của cô dâu chú rể" data-i18n-attr="aria-label:booth.strip">
          <div class="strip__frame"><img src="assets/img/photobooth/photo-1.png" alt="" width="317" height="226"></div>
          <div class="strip__frame"><img src="assets/img/photobooth/photo-2.png" alt="" width="316" height="224"></div>
          <div class="strip__frame"><img src="assets/img/photobooth/photo-3.png" alt="" width="316" height="229"></div>
          <div class="strip__frame"><img src="assets/img/photobooth/photo-4.png" alt="" width="319" height="227"></div>
        </figure>
      </div>
    </div>

    <!-- PLACEHOLDER: date -->
    <p class="booth__date" data-after style="--i:0"><time datetime="2027-06-26" data-i18n="booth.date">26. 06. 2027</time></p>

    <a class="btn btn--square" href="invitation" data-after style="--i:1" data-i18n="booth.open">Mở thiệp mời</a>
  </main>

  <script src="assets/js/i18n.js"></script>
  <script>
    document.querySelector('a[href="invitation"]').href = invitation;
  </script>
  <script src="assets/js/page-transitions.js"></script>
</body>
</html>
